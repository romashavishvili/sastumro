<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0F1B16"/>
  <!-- Outer architectural brass ring echoing the 3D hero chandelier -->
  <circle cx="32" cy="32" r="21" stroke="#C9A227" stroke-width="2.5"/>
  <!-- Delicate inner concentric halo ring -->
  <circle cx="32" cy="32" r="14" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.65"/>
  <!-- Central optical brass light point / sphere -->
  <circle cx="32" cy="32" r="4.5" fill="#C9A227"/>
  <!-- Top vertical suspension stay -->
  <line x1="32" y1="3" x2="32" y2="11" stroke="#C9A227" stroke-width="2"/>
</svg>
