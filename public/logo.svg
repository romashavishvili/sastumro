<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Architectural Ring Emblem Motif -->
  <g transform="translate(6, 6)">
    <!-- Outer brass ring -->
    <circle cx="18" cy="18" r="15" stroke="#C9A227" stroke-width="1.8"/>
    <!-- Concentric inner ring with subtle dashes -->
    <circle cx="18" cy="18" r="10" stroke="#C9A227" stroke-width="0.9" stroke-dasharray="2 2.5" stroke-opacity="0.7"/>
    <!-- Central warm optical sphere -->
    <circle cx="18" cy="18" r="3.2" fill="#C9A227"/>
    <!-- Top suspension collar stay -->
    <line x1="18" y1="0" x2="18" y2="3" stroke="#C9A227" stroke-width="1.5"/>
  </g>

  <!-- Georgian Wordmark "ამარა" in refined serif -->
  <text x="52" y="27" font-family="'Noto Serif Georgian', 'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#F3EFE6" letter-spacing="0.06em">
    ამარა
  </text>

  <!-- Subtitle "სასტუმრო • თბილისი" -->
  <text x="53" y="39" font-family="'Noto Sans Georgian', 'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#C9A227" letter-spacing="0.22em">
    სასტუმრო • თბილისი
  </text>
</svg>
